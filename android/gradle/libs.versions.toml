[versions]
agp = "9.3.2"
kotlin = "2.3.21"
compose-bom = "2026.08.00"
activity-compose = "1.12.4"
hilt = "2.60.1"
androidx-hilt = "1.4.0"
ksp = "2.3.11"
junit4 = "4.13.2"
lifecycle = "2.10.0"
navigation3 = "1.1.7"
serialization = "1.11.0"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
espresso = "3.7.0"
datastore = "1.2.1"
coroutines = "1.10.2"

[libraries]
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
